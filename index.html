<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOOPFORM ULTRA | AI Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505;
  --surface: #111111;
  --orange: #FF5500;
  --gold: #FFB800;
  --green: #00E676;
  --red: #FF1744;
  --blue: #00B0FF;
  --text: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow: hidden; height: 100vh; }

/* ── UI ELEMENTS ── */
.screen { display: none; height: 100vh; flex-direction: column; }
.active { display: flex; }

.header { padding: 25px 20px; background: linear-gradient(180deg, #1a0a00 0%, transparent 100%); text-align: center; }
.logo { font-family: 'Bebas Neue', cursive; font-size: 40px; letter-spacing: 3px; color: var(--text); }
.logo span { color: var(--orange); }

/* ── MODO SELECTOR ── */
.env-selector { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
.env-btn { padding: 8px 20px; border-radius: 99px; border: 1px solid #333; background: var(--surface); color: #888; font-weight: 700; cursor: pointer; transition: 0.3s; }
.env-btn.active { background: var(--orange); color: white; border-color: var(--orange); box-shadow: 0 0 15px var(--orange); }

/* ── CAMERA & HUD ── */
#cam-container { position: relative; flex: 1; background: #000; overflow: hidden; }
video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

.hud-top { position: absolute; top: 15px; left: 0; right: 0; display: flex; justify-content: space-around; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
.hud-active .hud-top { opacity: 1; pointer-events: all; }
.stat-box { background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; min-width: 80px; }
.stat-val { font-family: 'Bebas Neue'; font-size: 32px; line-height: 1; color: var(--orange); }
.stat-lbl { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 1px; }

.hud-bottom { position: absolute; bottom: 20px; left: 20px; right: 20px; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
.hud-active .hud-bottom { opacity: 1; }
#status-msg { font-family: 'Bebas Neue'; font-size: 24px; color: var(--orange); text-shadow: 0 0 10px rgba(0,0,0,0.5); }

/* ── BOTONES ── */
.controls { padding: 20px; display: flex; gap: 10px; background: var(--bg); display: none; }
.btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-family: 'Bebas Neue'; font-size: 20px; cursor: pointer; transition: 0.2s; }
.btn-main { background: var(--orange); color: white; }
.btn-sec { background: var(--surface); color: #888; border: 1px solid #333; }

/* ── EFECTO GLOW ── */
#perfect-glow { position: absolute; inset: 0; border: 0px solid var(--gold); pointer-events: none; transition: 0.3s; opacity: 0; z-index: 10; }
.glow-active { border: 8px solid var(--gold) !important; opacity: 1 !important; box-shadow: inset 0 0 50px var(--gold); }

/* ── LOADING OVERLAY ── */
#loading-overlay { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #ccc; }
.spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--orange); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

#load-error { display: none; color: var(--red); font-weight: 700; margin-top: 20px; text-align: center; }
#retry-btn { display: none; margin-top: 20px; padding: 10px 30px; }
</style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p style="font-weight:700; letter-spacing:2px">CARGANDO IA...</p>
    <div id="load-error">Error: Tiempo de espera de cámara agotado.</div>
    <button class="btn btn-main" id="start-btn-fallback" style="display: none; margin-top: 20px; padding: 10px 30px;">REINTENTAR INICIO</button>
</div>

<div id="app-screen" class="screen active">
    <div class="header">
        <div class="logo">HOOPFORM <span>ULTRA</span></div>
        <div class="env-selector">
            <button class="env-btn active" onclick="switchEnv('casa', this)">🏠 MODO CASA</button>
            <button class="env-btn" onclick="switchEnv('cancha', this)">🏀 CANCHA</button>
        </div>
    </div>

    <div id="cam-container">
        <video id="webcam" playsinline muted style="display: none;"></video>
        <canvas id="output-canvas"></canvas>
        <div id="perfect-glow"></div>
        
        <div class="hud-top">
            <div class="stat-box"><div class="stat-val" id="count-val">0</div><div class="stat-lbl" id="count-lbl">REPS</div></div>
            <div class="stat-box"><div class="stat-val" id="score-val">--</div><div class="stat-lbl">FORMA</div></div>
            <div class="stat-box"><div class="stat-val" id="bpm-val">--</div><div class="stat-lbl">BPM</div></div>
        </div>

        <div class="hud-bottom">
            <div id="status-msg">ESPERANDO DETECCIÓN...</div>
        </div>
    </div>

    <div class="controls" id="session-controls">
        <button class="btn btn-sec" onclick="resetStats()">REINICIAR</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose" async></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils" async></script>

<script>
let state = {
    env: 'casa',
    running: false,
    reps: 0,
    lastHandY: 0,
    isDribbling: false,
    trajectory: [],
    mediaPipeLoaded: false,
    sessionActive: false
};

const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output-canvas');
const ctx = canvasElement.getContext('2d');
const overlay = document.getElementById('loading-overlay');
const camContainer = document.getElementById('cam-container');
const fallbackBtn = document.getElementById('start-btn-fallback');
const errorMsg = document.getElementById('load-error');

// --- ASISTENTE DE VOZ ---
let lastSayTime = 0;
function say(text) {
    const now = Date.now();
    if (now - lastSayTime < 2000) return; // Evitar spam
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'es-ES';
    msg.rate = 1.1;
    window.speechSynthesis.speak(msg);
    lastSayTime = now;
}

function switchEnv(env, btn) {
    state.env = env;
    document.querySelectorAll('.env-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (state.sessionActive) say("Modo " + env + " activado");
}

function resetStats() {
    state.reps = 0;
    state.trajectory = [];
    document.getElementById('count-val').textContent = "0";
    say("Estadísticas reiniciadas");
}

// --- DIBUJO NEÓN Y ESQUELETO ---
function drawEnhancedSkel(lm, ctx, w, h) {
    // 1. Trayectoria Neón
    if (state.env === 'cancha') {
        const rWrist = lm[16];
        state.trajectory.push({x: rWrist.x * w, y: rWrist.y * h});
        if (state.trajectory.length > 20) state.trajectory.shift();
        
        ctx.beginPath();
        state.trajectory.forEach((p, i) => {
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = `rgba(255, 85, 0, ${i / 20})`;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
        });
        ctx.stroke();
    }

    // 2. Esqueleto Neón
    const connections = [[11,12], [11,23], [12,24], [23,24], [12,14], [14,16], [11,13], [13,15]];
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    connections.forEach(([a, b]) => {
        if (!lm[a] || !lm[b]) return;
        ctx.beginPath();
        ctx.moveTo(lm[a].x * w, lm[a].y * h);
        ctx.lineTo(lm[b].x * w, lm[b].y * h);
        ctx.stroke();
    });

    // Puntos clave de neón
    const keypoints = [16, 15, 12, 11]; // Muñecas, Hombros
    keypoints.forEach(i => {
        if (!lm[i]) return;
        ctx.beginPath();
        ctx.arc(lm[i].x * w, lm[i].y * h, 7, 0, Math.PI*2);
        ctx.fillStyle = i >= 15 ? "#FF5500" : "white"; // Muñecas naranjas
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.lineWidth = 1;
        ctx.stroke();
    });
}

// --- LÓGICA DE IA ---
function onResults(results) {
    if (!results.poseLandmarks) return;

    // Primer frame: ocultar carga y activar HUD
    if (!state.sessionActive) {
        overlay.style.display = 'none';
        camContainer.classList.add('hud-active');
        document.getElementById('session-controls').style.display = 'flex';
        say("Sistema Hoopform Iniciado");
        state.sessionActive = true;
        clearTimeout(loadTimeout); // Cancelar fallback btn
    }

    const w = canvasElement.width = videoElement.videoWidth || 640;
    const h = canvasElement.height = videoElement.videoHeight || 480;
    ctx.clearRect(0, 0, w, h);

    const lm = results.poseLandmarks;
    const rWrist = lm[16];
    const lWrist = lm[15];
    const rShoulder = lm[12];
    const handY = Math.max(rWrist.y, lWrist.y); // Más cerca del suelo

    // 1. DETECCIÓN AUTOMÁTICA DE DRIBBLE
    const inflexionThreshold = state.env === 'casa' ? 0.75 : 0.65;
    if (handY > inflexionThreshold && handY < state.lastHandY && !state.isDribbling) {
        state.isDribbling = true;
        state.reps++;
        document.getElementById('count-val').textContent = state.reps;
        
        const now = Date.now();
        if(state.lastHandY > 0.3) {
            const bpm = Math.round(60000 / (now - (state.lastBPMTime || now - 500)));
            document.getElementById('bpm-val').textContent = bpm > 10 && bpm < 250 ? bpm : '--';
        }
        state.lastBPMTime = now;
        
        if (state.reps % 20 === 0) say(state.reps + " botes. ¡Buen ritmo!");
    }
    if (handY > state.lastHandY) state.isDribbling = false;
    state.lastHandY = handY;

    // 2. ANALIZAR FORMA (Tiro)
    let score = 10;
    if (rWrist.y > rShoulder.y + 0.1) score -= 3; // Codos muy bajos
    if (Math.abs(rShoulder.x - lm[11].x) > 0.1) score -= 2; // Hombros desnivelados

    document.getElementById('score-val').textContent = score;
    
    // EFECTO PERFECTO (Brillo Dorado)
    if (score >= 9 && state.env === 'cancha') {
        const glow = document.getElementById('perfect-glow');
        glow.classList.add('glow-active');
        setTimeout(() => glow.classList.remove('glow-active'), 500);
    }

    // 3. DIBUJAR ESQUELETO Y ARC
    drawEnhancedSkel(lm, ctx, w, h);
}

// --- INICIALIZACIÓN ---
let loadTimeout;

async function initApp() {
    overlay.style.display = 'flex';
    fallbackBtn.style.display = 'none';
    errorMsg.style.display = 'none';

    try {
        // Verificar disponibilidad de librerías
        if (!window.Pose || !window.Camera) {
            say("Aún estamos cargando las librerías. Por favor, espera.");
            return; 
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
        pose.onResults(onResults);

        // Fallback button si el primer frame tarda más de 8s (iOS bloqueo)
        loadTimeout = setTimeout(() => {
            if (!state.sessionActive) {
                errorMsg.style.display = 'block';
                fallbackBtn.style.display = 'block';
                say("Si la cámara no arranca, toca el botón para forzar inicio");
            }
        }, 8000);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: {ideal: 640}, height: {ideal: 480}
        });
        camera.start();

    } catch (e) {
        errorMsg.style.display = 'block';
        fallbackBtn.style.display = 'block';
        fallbackBtn.textContent = 'REINTENTAR ACCESO';
        say("Hubo un problema de cámara. Revisa permisos.");
    }
}

// Escuchar inicio por reintentar
fallbackBtn.addEventListener('click', initApp);

// Arrancar inicio si las librerías cargan antes de que el usuario haga nada
window.addEventListener('load', () => {
    // Pequeño retardo para asegurar scripts asíncronos
    setTimeout(initApp, 1000); 
});
</script>
</body>
</html>
