<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOOPFORM ULTRA | AI Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505;
  --surface: #111111;
  --orange: #FF5500;
  --gold: #FFB800;
  --green: #00E676;
  --red: #FF1744;
  --blue: #00B0FF;
  --text: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow: hidden; height: 100vh; }

/* ── UI ELEMENTS ── */
.screen { display: none; height: 100vh; flex-direction: column; }
.active { display: flex; }

.header { padding: 25px 20px; background: linear-gradient(180deg, #1a0a00 0%, transparent 100%); text-align: center; }
.logo { font-family: 'Bebas Neue', cursive; font-size: 40px; letter-spacing: 3px; color: var(--text); }
.logo span { color: var(--orange); }

/* ── MODO SELECTOR ── */
.env-selector { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
.env-btn { padding: 8px 20px; border-radius: 99px; border: 1px solid #333; background: var(--surface); color: #888; font-weight: 700; cursor: pointer; transition: 0.3s; }
.env-btn.active { background: var(--orange); color: white; border-color: var(--orange); box-shadow: 0 0 15px var(--orange); }

/* ── CAMERA & HUD ── */
#cam-container { position: relative; flex: 1; background: #000; overflow: hidden; }
video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

.hud-top { position: absolute; top: 15px; left: 0; right: 0; display: flex; justify-content: space-around; pointer-events: none; }
.stat-box { background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; min-width: 80px; }
.stat-val { font-family: 'Bebas Neue'; font-size: 32px; line-height: 1; color: var(--orange); }
.stat-lbl { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 1px; }

.hud-bottom { position: absolute; bottom: 20px; left: 20px; right: 20px; pointer-events: none; }
#status-msg { font-family: 'Bebas Neue'; font-size: 24px; color: var(--orange); text-shadow: 0 0 10px rgba(0,0,0,0.5); }

/* ── BOTONES ── */
.controls { padding: 20px; display: flex; gap: 10px; background: var(--bg); }
.btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-family: 'Bebas Neue'; font-size: 20px; cursor: pointer; transition: 0.2s; }
.btn-main { background: var(--orange); color: white; }
.btn-sec { background: var(--surface); color: #888; border: 1px solid #333; }

/* ── EFECTO GLOW ── */
#perfect-glow { position: absolute; inset: 0; border: 0px solid var(--gold); pointer-events: none; transition: 0.3s; opacity: 0; z-index: 10; }
.glow-active { border: 8px solid var(--gold) !important; opacity: 1 !important; box-shadow: inset 0 0 50px var(--gold); }

#loading-overlay { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--orange); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div><p style="margin-top:15px; font-weight:700; letter-spacing:2px">CARGANDO IA...</p></div>

<div id="app-screen" class="screen active">
    <div class="header">
        <div class="logo">HOOPFORM <span>ULTRA</span></div>
        <div class="env-selector">
            <button class="env-btn active" onclick="switchEnv('casa', this)">🏠 MODO CASA</button>
            <button class="env-btn" onclick="switchEnv('cancha', this)">🏀 CANCHA</button>
        </div>
    </div>

    <div id="cam-container">
        <video id="webcam" playsinline muted></video>
        <canvas id="output-canvas"></canvas>
        <div id="perfect-glow"></div>
        
        <div class="hud-top">
            <div class="stat-box"><div class="stat-val" id="count-val">0</div><div class="stat-lbl" id="count-lbl">REPS</div></div>
            <div class="stat-box"><div class="stat-val" id="score-val">--</div><div class="stat-lbl">FORMA</div></div>
            <div class="stat-box"><div class="stat-val" id="bpm-val">--</div><div class="stat-lbl">BPM</div></div>
        </div>

        <div class="hud-bottom">
            <div id="status-msg">ESPERANDO DETECCIÓN...</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-sec" onclick="resetStats()">REINICIAR</button>
        <button class="btn btn-main" id="start-btn" onclick="initApp()">INICIAR CÁMARA</button>
    </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<script>
let state = {
    env: 'casa',
    running: false,
    reps: 0,
    lastHandY: 0,
    isDribbling: false,
    historyY: [],
    lastBPM: 0,
    trajectory: []
};

const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output-canvas');
const ctx = canvasElement.getContext('2d');

// --- ASISTENTE DE VOZ ---
function say(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'es-ES';
    msg.rate = 1.1;
    window.speechSynthesis.speak(msg);
}

function switchEnv(env, btn) {
    state.env = env;
    document.querySelectorAll('.env-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    say("Modo " + env + " activado");
}

function resetStats() {
    state.reps = 0;
    document.getElementById('count-val').textContent = "0";
    say("Estadísticas reiniciadas");
}

// --- LÓGICA DE IA ---
function onResults(results) {
    if (!results.poseLandmarks) return;
    document.getElementById('loading-overlay').style.display = 'none';

    const w = canvasElement.width = videoElement.videoWidth;
    const h = canvasElement.height = videoElement.videoHeight;
    ctx.clearRect(0, 0, w, h);

    const lm = results.poseLandmarks;
    const rWrist = lm[16];
    const lWrist = lm[15];
    const rShoulder = lm[12];
    const handY = Math.max(rWrist.y, lWrist.y); // Más cerca del suelo

    // 1. DIBUJAR TRAYECTORIA (NEON ARC)
    if (state.env === 'cancha') {
        state.trajectory.push({x: rWrist.x * w, y: rWrist.y * h});
        if (state.trajectory.length > 15) state.trajectory.shift();
        ctx.beginPath();
        state.trajectory.forEach((p, i) => {
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = `rgba(255, 85, 0, ${i / 15})`;
            ctx.lineWidth = 4;
        });
        ctx.stroke();
    }

    // 2. DETECCIÓN AUTOMÁTICA
    // Lógica Dribble (Puntos de inflexión)
    if (handY > 0.65 && handY < state.lastHandY && !state.isDribbling) {
        state.isDribbling = true;
        state.reps++;
        updateUI();
    }
    if (handY > state.lastHandY) state.isDribbling = false;
    state.lastHandY = handY;

    // 3. ANALIZAR FORMA (Simplificado para velocidad)
    let score = 10;
    if (rWrist.y > rShoulder.y) score -= 4; // Codos bajos
    
    document.getElementById('score-val').textContent = score;
    
    // EFECTO PERFECTO
    if (score >= 9) {
        document.getElementById('perfect-glow').classList.add('glow-active');
        setTimeout(() => document.getElementById('perfect-glow').classList.remove('glow-active'), 500);
    }

    // 4. DIBUJAR ESQUELETO PRO
    drawSkeleton(lm, ctx, w, h);
}

function drawSkeleton(lm, ctx, w, h) {
    const connections = [[11,12], [11,23], [12,24], [23,24], [12,14], [14,16], [11,13], [13,15]];
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 2;
    connections.forEach(([a, b]) => {
        ctx.beginPath();
        ctx.moveTo(lm[a].x * w, lm[a].y * h);
        ctx.lineTo(lm[b].x * w, lm[b].y * h);
        ctx.stroke();
    });
    // Puntos clave neón
    [16, 15, 12, 11].forEach(i => {
        ctx.beginPath();
        ctx.arc(lm[i].x * w, lm[i].y * h, 6, 0, Math.PI*2);
        ctx.fillStyle = i >= 15 ? varColor('--orange') : "white";
        ctx.fill();
    });
}

function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

function updateUI() {
    document.getElementById('count-val').textContent = state.reps;
    if (state.reps % 20 === 0) say(state.reps + " botes. ¡Sigue así!");
}

async function initApp() {
    document.getElementById('start-btn').style.display = 'none';
    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => { await pose.send({image: videoElement}); },
        width: 640, height: 480
    });
    camera.start();
    say("Sistema Hoopform Iniciado");
}
</script>
</body>
</html>
